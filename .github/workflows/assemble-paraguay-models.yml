name: Assemble Paraguay_models.csv
on:
  push:
    paths:
      - 'data/models/**'
      - 'data/Paraguay.csv'
      - 'data/chargers-dc.csv'
      - 'scripts/build-summary.py'
      - '.github/workflows/assemble-paraguay-models.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble monthly CSVs
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import csv
          from pathlib import Path

          fields = [
              "period", "variant", "segmento", "marca", "modelo",
              "powertrain", "condicion", "units", "source", "notes", "edicion",
          ]
          out = Path("data/Paraguay_models.csv")
          rows = []
          for path in sorted(Path("data/models").glob("????-??.csv")):
              with path.open(newline="", encoding="utf-8") as src:
                  for row in csv.DictReader(src):
                      if not (row.get("condicion") or "").strip():
                          row["condicion"] = "desconocido"
                      rows.append({field: row.get(field, "") for field in fields})

          with out.open("w", newline="", encoding="utf-8") as dst:
              writer = csv.DictWriter(dst, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          print(f"assembled {len(rows)} rows into {out}")
          PYTHON
      - name: Build summary.json for Inicio
        run: python3 scripts/build-summary.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Paraguay_models.csv data/summary.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data: assemble Paraguay_models.csv from monthly parts"
          git push
